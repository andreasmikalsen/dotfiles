[[themes]]
name = "tokyonight-night"

[themes.palette]
background = "#1a1b26"
foreground = "#c0caf5"

black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

bright_black = "#414868"
bright_red = "#f7768e"
bright_green = "#9ece6a"
bright_yellow = "#e0af68"
bright_blue = "#7aa2f7"
bright_magenta = "#bb9af7"
bright_cyan = "#7dcfff"
bright_white = "#c0caf5"

[themes.component_style]
block_title = {
  fg = "Blue",
  modifiers = ["Bold"]
}

border = {
  fg = "BrightBlack"
}

playback_status = {
  fg = "Green",
  modifiers = ["Bold"]
}

playback_track = {
  fg = "Blue",
  modifiers = ["Bold"]
}

playback_artists = {
  fg = "Cyan"
}

playback_album = {
  fg = "Yellow"
}

playback_genres = {
  fg = "BrightBlack"
}

playback_metadata = {
  fg = "BrightBlack"
}

playback_progress_bar = {
  fg = "Blue",
  bg = "BrightBlack"
}

playback_progress_bar_unfilled = {
  fg = "BrightBlack"
}

current_playing = {
  fg = "Green",
  modifiers = ["Bold"]
}

page_desc = {
  fg = "Magenta",
  modifiers = ["Bold"]
}

playlist_desc = {
  fg = "BrightBlack"
}

table_header = {
  fg = "Blue",
  modifiers = ["Bold"]
}

selection = {
  fg = "BrightWhite",
  bg = "BrightBlack",
  modifiers = ["Bold"]
}

secondary_row = {
  fg = "BrightBlack"
}

like = {
  fg = "Red"
}

lyrics_played = {
  fg = "BrightBlack"
}

lyrics_playing = {
  fg = "Green",
  modifiers = ["Bold"]
}
